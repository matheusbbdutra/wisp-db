# Postgres local só para desenvolvimento/teste manual do PostgresDriver
# (internal/db/postgres.go). Não faz parte do produto — nunca referenciado
# em build de release.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wisp-postgres-test
    environment:
      POSTGRES_USER: wisp
      POSTGRES_PASSWORD: wisp
      POSTGRES_DB: wisp_test
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisp -d wisp_test"]
      interval: 2s
      timeout: 3s
      retries: 10
